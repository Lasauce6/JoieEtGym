name: Laravel

on:
  push:
    branches:
      - master
      - dev
      - dependabot/**
  pull_request:
    branches:
      - master
      - dev

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11.4.10
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: joieetgym_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    strategy:
      matrix:
        php-version: ['8.2']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysqlnd, sqlite, pdo_mysql, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug
          tools: composer:v2

      - name: Copy .env
        run: cp .env.testing .env

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute migrations
        run: php artisan migrate --env=testing

      - name: Execute seeders (if needed)
        run: php artisan db:seed --env=testing

      - name: Run PHPUnit tests with coverage
        run: php artisan test --env=testing --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
