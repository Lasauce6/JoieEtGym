name: Deploy Project

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get SSH Key and set permissions
        run: |
          mkdir -p ~/.ssh
          echo "{{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          echo "{{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub && chmod 600 ~/.ssh/id_rsa.pub
      - name: Deploy 
        run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/ird_rsa.pub ${{ secrets.SSH_USER }}@{{ secrets.SSH_HOST }} "dploy deploy master"
